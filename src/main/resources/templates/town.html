<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 로비</title>
    <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box }
        body {
            margin: 0; overflow: hidden; background: #010409;
            font-family: 'Pretendard', sans-serif; color: #fff
        }
        .serif { font-family: 'Gowun Batang', serif }
        .bg-layer { position: absolute; inset: 0; z-index: 0 }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; opacity: .4 }
        
        .glass-panel { background: rgba(10, 15, 28, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .glass-panel-circle { background: rgba(10, 15, 28, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; }
        .glass-button { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.12); transition: all 0.3s; cursor: pointer; }
        .glass-button:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

        .jade-bar { background: linear-gradient(90deg, #10b981, #059669); }
        
        .char-wrap {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            height: 94vh; z-index: 2; pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 95%);
            mask-image: linear-gradient(to bottom, #000 60%, transparent 95%);
        }
        .char-wrap img { height: 100%; object-fit: contain; }

        .char-switcher {
            position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between;
            padding: 0 8%; z-index: 10; pointer-events: none;
        }
        .switcher-btn {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; pointer-events: auto;
        }

        .gate-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 320px; }
        .gate-card {
            height: 70px; padding: 10px; display: flex; flex-direction: column; justify-content: center;
            position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gate-main { grid-column: span 2; height: 90px; background: linear-gradient(135deg, #b45309, #78350f); border-color: #f59e0b; }
        
        @keyframes pulse-cp { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-cp { animation: pulse-cp 2s infinite ease-in-out; }

        /* 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; transition: all 0.3s; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('lobbyApp', () => ({
            playerGender: 'MALE', playerNickname: '모험가', level: 1, exp: 0, requiredExp: 100,
            gold: 0, gems: 0, tickets: 200, maxTickets: 200, lastTicketTime: Date.now(),
            claimedLevelRewards: "", claimedActRewards: "", storyChapter: 0, currentModal: null, modalTitle: '', alertMessage: '', isLoading: true, customPortrait: null,
            gachaResults: [], isGachaAnimating: false, myCharacters: [], currentCharIndex: 0, currentParty: [null, null, null, null],
            combatPower: 0, partyCombatPower: 0, serverRank: '--', towerFloor: 1, hallStage: 1, raidStage: 1, maxClearedStageId: 0,
            currentQuest: { id: 0, title: '로딩 중...', goalDesc: '데이터 동기화 중...', status: 'IN_PROGRESS' },
            stages: [], currentChapter: 1, selectedPartySlot: 0,
            ranking: [], guideStep: 0, guideActive: false, guideMonologueText: '',
            selectedChar: null,
            
            advanceGuideMonologue() {
                console.log("Guide advanced");
                this.guideActive = false;
            },

            async init() {
                await this.loadPlayerInfo();
                await this.loadMyCharacters();
                await this.fetchQuestInfo();
                
                setInterval(() => {
                    if (this.tickets < this.maxTickets) {
                        this.tickets++;
                        this.lastTicketTime = Date.now();
                    }
                }, 180000);

                this.isLoading = false;
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            },

            async loadPlayerInfo() {
                try {
                    const res = await fetch('/api/map/player-info');
                    const data = await res.json();
                    if (data.success) {
                        this.playerGender = data.gender;
                        this.playerNickname = data.nickname;
                        this.level = data.level || 1;
                        this.exp = data.exp || 0;
                        this.requiredExp = data.requiredExp || 100;
                        this.gold = data.gold || 0;
                        this.gems = data.gems || 0;
                        this.tickets = data.tickets !== undefined ? data.tickets : 200;
                        this.combatPower = data.totalPower || 0;
                        this.partyCombatPower = data.partyPower || 0;
                        this.serverRank = data.serverRank || '--';
                        this.towerFloor = data.towerFloor;
                        this.hallStage = data.hallStage;
                        this.raidStage = data.raidStage;
                        this.maxClearedStageId = data.maxClearedStageId;
                        this.claimedActRewards = data.claimedActRewards || "";
                        this.claimedLevelRewards = data.claimedLevelRewards || "";
                        this.storyChapter = data.storyChapter || 0;
                        if (data.profileImagePath) this.customPortrait = data.profileImagePath;
                        if (data.mainCharacterId) this.serverMainCharacterId = data.mainCharacterId;
                    }
                } catch (e) { console.warn(e); }
            },

            async fetchRanking() {
                try {
                    const res = await fetch('/api/map/ranking');
                    const data = await res.json();
                    if (data.success) this.ranking = data.ranking;
                } catch (e) { console.error(e); }
            },

            async fetchQuestInfo() {
                try {
                    const res = await fetch('/api/quest/current');
                    if (res.ok) this.currentQuest = await res.json();
                } catch (e) { console.error(e); }
            },

            async loadMyCharacters() {
                try {
                    const res = await fetch('/api/lobby/my-characters');
                    const data = await res.json();
                    if (data.success && data.characters) {
                        this.myCharacters = data.characters.map(c => ({
                            id: c.id, name: c.name, src: c.imagePath, rarity: c.rarity, role: c.role, level: c.level,
                            hp: c.hp, atk: c.atk, def: c.def, spd: c.spd, title: c.title, element: c.element,
                            family: c.family, age: c.age, gender: c.gender, personality: c.personality, relationships: c.relationships
                        }));
                        if (data.party) {
                             const saved = data.party;
                             for (let i=0; i<4; i++) {
                                 if (saved[i]) this.currentParty[i] = this.myCharacters.find(ch => ch.id === saved[i]) || null;
                             }
                        }
                        if (this.serverMainCharacterId) {
                            const idx = this.myCharacters.findIndex(c => c.id === this.serverMainCharacterId);
                            if (idx !== -1) this.currentCharIndex = idx;
                        }
                    }
                } catch (e) { console.warn(e); }
            },

            get playerPortrait() { return this.customPortrait || (this.playerGender === 'FEMALE' ? '/images/portrait_female.png' : '/images/portrait_male.png'); },
            get currentLobbyCharacter() { return this.myCharacters.length > 0 ? this.myCharacters[this.currentCharIndex % this.myCharacters.length] : { src: this.playerGender === 'FEMALE' ? '/images/portrait_female.png' : '/images/portrait_male.png' }; },
            
            nextCharacter() { this.currentCharIndex = (this.currentCharIndex + 1) % this.myCharacters.length; },
            prevCharacter() { this.currentCharIndex = (this.currentCharIndex - 1 + this.myCharacters.length) % this.myCharacters.length; },

            openModal(type) {
                if (type === 'RANKING') this.fetchRanking();
                this.currentModal = type;
                this.$nextTick(() => lucide.createIcons());
            },
            closeModal() { this.currentModal = null; },
            showAlert(msg) {
                this.alertMessage = msg;
                this.openModal('SYSTEM_ALERT');
            },
            handleQuestClick() { 
                if (this.currentQuest.status === 'COMPLETED') {
                    this.openModal('QUEST_REWARD_CLAIM'); 
                } else {
                    window.location.href = '/stage-select'; 
                }
            },
            
            togglePartyMember(char) {
                const idx = this.currentParty.findIndex(p => p && p.id === char.id);
                if (idx !== -1) {
                    this.currentParty[idx] = null;
                } else {
                    const emptySlot = this.currentParty.findIndex(p => p === null);
                    if (emptySlot !== -1) this.currentParty[emptySlot] = char;
                }
            },

            async saveParty() {
                const ids = this.currentParty.map(p => p ? p.id : null);
                try {
                    const res = await fetch('/api/lobby/save-party', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ partyIds: ids })
                    });
                    if (res.ok) this.showAlert("편성이 저장되었습니다.");
                } catch (e) { console.error(e); }
            },

            async drawGacha(count) {
                this.isGachaAnimating = true;
                this.gachaResults = [];
                try {
                    const res = await fetch('/api/gacha/draw?count=' + count, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        setTimeout(() => {
                            this.gachaResults = data.results;
                            this.isGachaAnimating = false;
                            this.loadPlayerInfo();
                            this.loadMyCharacters();
                        }, 1500);
                    } else {
                        this.showAlert(data.message || "영입 실패");
                        this.isGachaAnimating = false;
                    }
                } catch (e) { 
                    console.error(e);
                    this.isGachaAnimating = false;
                }
            },

            async claimLevelReward(lvl) {
                try {
                    const res = await fetch('/api/lobby/claim-level-reward', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ level: lvl })
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.showAlert(data.message);
                        this.loadPlayerInfo();
                    } else {
                        this.showAlert(data.message);
                    }
                } catch (e) { console.error(e); }
            },

            async claimQuestReward() {
                try {
                    const res = await fetch('/api/quest/claim', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        const gems = data.completedQuest.rewardGems;
                        const gold = data.completedQuest.rewardGold;
                        this.showAlert("보상을 수령했습니다! (보석 " + gems + ", 골드 " + gold + ")");
                        this.closeModal();
                        await this.loadPlayerInfo();
                        await this.fetchQuestInfo();
                    } else {
                        this.showAlert(data.message || "보상 수령 실패");
                    }
                } catch (e) {
                    console.error(e);
                    this.showAlert("서버 통신 오류");
                }
            },

            async setLobbyCharacter(characterId) {
                try {
                    const res = await fetch('/api/lobby/main-character', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ characterId: characterId })
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.showAlert("로비 무인이 변경되었습니다.");
                        this.currentCharIndex = this.myCharacters.findIndex(c => c.id === characterId);
                        this.closeModal();
                    }
                } catch (e) { console.error(e); }
            },

            openCharDetail(char) {
                this.selectedChar = char;
                this.openModal('CHAR_DETAIL');
                this.$nextTick(() => this.renderStatChart(char));
            },

            renderStatChart(char) {
                const ctx = document.getElementById('statChart').getContext('2d');
                if (this.statChartInstance) this.statChartInstance.destroy();
                this.statChartInstance = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['체력', '공격력', '방어력', '속도'],
                        datasets: [{
                            label: '무력 지수',
                            data: [char.hp / 10, char.atk * 2, char.def * 2, char.spd],
                            backgroundColor: 'rgba(245, 158, 11, 0.2)',
                            borderColor: '#F59E0B',
                            borderWidth: 2,
                            pointBackgroundColor: '#F59E0B'
                        }]
                    },
                    options: {
                        scales: {
                            r: {
                                angleLines: { color: 'rgba(255,255,255,0.1)' },
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                pointLabels: { color: '#94a3b8', font: { size: 10 } },
                                ticks: { display: false }
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            },

            async selectPortrait(path) {
                try {
                    const res = await fetch('/api/lobby/update-profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ profileImagePath: path })
                    });
                    if (res.ok) {
                        this.customPortrait = path;
                        this.closeModal();
                        this.showAlert("초상화가 변경되었습니다.");
                    }
                } catch (e) { console.error(e); }
            }
        }));
    });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="lobbyApp">
    <div class="bg-layer">
        <img th:src="@{/images/bg_mainss.png}" alt="bg" loading="eager">
    </div>

    <div x-show="isLoading" class="fixed inset-0 z-[100] bg-[#0a0e1a] flex items-center justify-center">
        <div class="text-center">
            <div class="w-10 h-10 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400 text-sm tracking-widest serif">입장 중...</p>
        </div>
    </div>

    <div class="char-wrap" x-show="!isLoading">
        <img :src="currentLobbyCharacter.src" loading="lazy">
    </div>

    <div class="char-switcher" x-show="!isLoading && myCharacters.length > 1">
        <button @click="prevCharacter()" class="switcher-btn glass-button"><i data-lucide="chevron-left"></i></button>
        <button @click="nextCharacter()" class="switcher-btn glass-button"><i data-lucide="chevron-right"></i></button>
    </div>

    <div class="relative z-10 w-screen h-screen flex flex-col justify-between pointer-events-none p-6" x-show="!isLoading">
        <header class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-4">
                <button @click="openModal('MY_PROFILE')" class="glass-panel-circle pr-6 pl-2 py-2 flex items-center gap-3 hover:bg-white/10 transition">
                    <div class="w-12 h-12 rounded-full border-2 border-amber-500/50 overflow-hidden bg-black/80">
                        <img :src="playerPortrait" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-white font-bold text-lg serif" x-text="playerNickname"></span>
                            <span class="bg-amber-600 text-[10px] px-1.5 py-0.5 rounded font-bold">Lv.<span x-text="level"></span></span>
                        </div>
                        <div class="w-32 h-1.5 bg-black/40 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full jade-bar transition-all duration-500" :style="'width:' + (exp/requiredExp*100) + '%'"></div>
                        </div>
                    </div>
                </button>

                <div class="flex gap-2">
                    <div class="glass-panel px-4 py-2 flex items-center gap-3 animate-cp border-amber-500/20">
                        <i data-lucide="swords" class="text-amber-500 w-5 h-5"></i>
                        <div>
                            <p class="text-[9px] text-amber-500/70 font-bold mb-0.5">대협 소지 무력</p>
                            <p class="text-lg font-black text-white font-mono leading-none" x-text="(combatPower || 0).toLocaleString()"></p>
                        </div>
                    </div>
                    <div class="glass-panel px-4 py-2 flex items-center gap-3 border-cyan-500/20">
                        <i data-lucide="shield-check" class="text-cyan-400 w-5 h-5"></i>
                        <div>
                            <p class="text-[9px] text-cyan-400/70 font-bold mb-0.5">출전 파티 무력</p>
                            <p class="text-lg font-black text-white font-mono leading-none" x-text="(partyCombatPower || 0).toLocaleString()"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-end gap-4">
                <div class="flex gap-2">
                    <div class="glass-panel-circle px-4 py-1.5 flex items-center gap-2">
                        <i data-lucide="coins" class="text-yellow-500 w-4 h-4"></i>
                        <span class="font-mono font-bold text-sm" x-text="(gold || 0).toLocaleString()"></span>
                    </div>
                    <div class="glass-panel-circle px-4 py-1.5 flex items-center gap-3 bg-slate-900/40 border-white/5">
                        <i data-lucide="gem" class="text-cyan-400 w-4 h-4 drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]"></i>
                        <span class="font-mono font-black text-sm text-cyan-50" x-text="(gems || 0).toLocaleString()"></span>
                    </div>
                    <div class="glass-panel-circle px-4 py-1.5 flex items-center gap-3 bg-slate-900/40 border-white/5 group relative cursor-help" title="지령서 (3분당 1개 회복)">
                        <i data-lucide="scroll" class="text-emerald-400 w-4 h-4 drop-shadow-[0_0_8px_rgba(52,211,153,0.5)]"></i>
                        <div class="flex flex-col -space-y-1">
                            <span class="font-mono font-black text-sm text-emerald-50"><span x-text="tickets"></span>/200</span>
                        </div>
                    </div>
                </div>
                
                <nav class="glass-panel flex p-1.5 gap-1">
                    <button @click="openModal('GACHA')" class="glass-button px-4 py-2 rounded-xl flex flex-col items-center gap-1 group">
                        <i data-lucide="wine" class="text-amber-500 w-5 h-5 group-hover:scale-110 transition"></i>
                        <span class="text-[10px] font-bold">객잔</span>
                    </button>
                    <button @click="openModal('RANKING')" class="glass-button px-4 py-2 rounded-xl flex flex-col items-center gap-1 group">
                        <i data-lucide="scroll-text" class="text-emerald-400 w-5 h-5 group-hover:scale-110 transition"></i>
                        <span class="text-[10px] font-bold">서열보</span>
                    </button>
                    <button @click="openModal('PARTY')" class="glass-button px-4 py-2 rounded-xl flex flex-col items-center gap-1 group">
                        <i data-lucide="users" class="text-blue-400 w-5 h-5 group-hover:scale-110 transition"></i>
                        <span class="text-[10px] font-bold">편성</span>
                    </button>
                    <button @click="openModal('INVENTORY')" class="glass-button px-4 py-2 rounded-xl flex flex-col items-center gap-1 group">
                        <i data-lucide="briefcase" class="text-purple-400 w-5 h-5 group-hover:scale-110 transition"></i>
                        <span class="text-[10px] font-bold">보따리</span>
                    </button>
                </nav>

                <div @click="handleQuestClick()" 
                     class="mt-2 glass-panel p-4 w-64 border-l-4 border-l-amber-500 cursor-pointer hover:bg-white/5 transition flex flex-col gap-1.5 relative overflow-hidden group pointer-events-auto">
                    <div class="absolute top-1 right-2 opacity-5 group-hover:opacity-10 transition"><i data-lucide="scroll" class="w-12 h-12"></i></div>
                    <div class="flex justify-between items-center">
                        <span class="text-amber-500 text-[9px] font-black tracking-widest uppercase">CURRENT QUEST</span>
                        <i data-lucide="arrow-right-circle" class="w-3 h-3 text-amber-500"></i>
                    </div>
                    <h4 class="text-white font-bold text-sm serif truncate" x-text="currentQuest.title"></h4>
                    <p class="text-slate-400 text-[10px] leading-tight line-clamp-2" x-text="currentQuest.goalDesc"></p>
                    
                    <template x-if="currentQuest.status === 'COMPLETED'">
                        <div class="mt-2 bg-amber-600/20 border border-amber-500 rounded py-1 flex items-center justify-center animate-pulse">
                            <span class="text-amber-400 text-[10px] font-bold serif">임무 완수! 보상 수령</span>
                        </div>
                    </template>
                </div>
            </div>
        </header>

        <main class="flex-1"></main>

        <footer class="flex justify-between items-end pointer-events-auto">
            <div></div>

            <div class="gate-grid">
                <button @click="handleQuestClick()" class="gate-card gate-main glass-button">
                    <span class="text-white/60 text-[10px] font-bold mb-1 uppercase tracking-tighter">MAIN STORY</span>
                    <span class="text-white text-2xl font-black serif drop-shadow-md">임무 시작</span>
                </button>
                <button @click="openModal('TOWER')" class="gate-card glass-button">
                    <span class="text-cyan-400/80 text-[10px] font-bold">무한의 탑</span>
                    <span class="text-white font-bold text-sm serif"><span x-text="towerFloor"></span>층 도전</span>
                </button>
                <button @click="openModal('RAID')" class="gate-card glass-button">
                    <span class="text-rose-400/80 text-[10px] font-bold">주간 레이드</span>
                    <span class="text-white font-bold text-sm serif">토벌전</span>
                </button>
                <button @click="openModal('DAILY_HALL')" class="gate-card glass-button col-span-2 !height-11 mt-1 flex-row gap-4 items-center justify-center">
                    <i data-lucide="compass" class="w-4 h-4 text-emerald-400"></i>
                    <span class="text-white font-bold text-sm serif">기억의 전당</span>
                </button>
            </div>
        </footer>
    </div>

    <div id="DIV_MODAL_ROOT" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none">
        <div x-show="currentModal" x-transition.opacity class="absolute inset-0 bg-black/60 pointer-events-auto" @click="closeModal()"></div>

        <div x-show="currentModal" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="relative z-10 w-full max-w-5xl px-4 pointer-events-auto">
            
            <template x-if="currentModal==='RANKING'">
                <div class="glass-panel w-full max-w-4xl mx-auto flex flex-col p-6 overflow-hidden shadow-2xl border-emerald-500/20" style="height: 80vh;">
                    <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">

                        <!-- Left Stats Chart Overlay -->
                        <div class="absolute bottom-6 left-6 w-36 h-36 bg-black/60 backdrop-blur-md rounded-2xl p-3 border border-white/10 shadow-2xl">
                             <canvas id="statChart"></canvas>
                        </div>

                        <div class="absolute top-6 right-6 text-right">
                            <span class="px-4 py-1.5 bg-amber-500 text-white text-[10px] font-black italic rounded-full shadow-lg" x-text="selectedChar.rarity"></span>
                            <h2 class="text-4xl font-black text-white serif mt-3 drop-shadow-lg" x-text="selectedChar.name"></h2>
                            <p class="text-amber-500 font-bold tracking-[0.3em] text-[11px] uppercase" x-text="selectedChar.title"></p>
                        </div>

                        <button @click="openModal('INVENTORY')" class="absolute top-6 left-6 p-2 bg-black/40 hover:bg-black/60 rounded-full border border-white/10 transition">
                            <i data-lucide="arrow-left" class="w-5 h-5 text-white"></i>
                        </button>
                    </div>

                    <div class="p-8 space-y-8 bg-[#0a0c10]">
                        <!-- Stat Bar Grid -->
                        <div class="grid grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <div class="flex justify-between text-[11px] font-bold text-slate-400"><span>체력 (HP)</span><span x-text="selectedChar.hp"></span></div>
                                <div class="h-1.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                                    <div class="h-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]" :style="'width: ' + Math.min(100, selectedChar.hp / 500 * 100) + '%'"></div>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-[11px] font-bold text-slate-400"><span>공격력 (ATK)</span><span x-text="selectedChar.atk"></span></div>
                                <div class="h-1.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                                    <div class="h-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.5)]" :style="'width: ' + Math.min(100, selectedChar.atk / 200 * 100) + '%'"></div>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-[11px] font-bold text-slate-400"><span>방어력 (DEF)</span><span x-text="selectedChar.def"></span></div>
                                <div class="h-1.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                                    <div class="h-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]" :style="'width: ' + Math.min(100, selectedChar.def / 200 * 100) + '%'"></div>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-[11px] font-bold text-slate-400"><span>속도 (SPD)</span><span x-text="selectedChar.spd"></span></div>
                                <div class="h-1.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                                    <div class="h-full bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.5)]" :style="'width: ' + Math.min(100, selectedChar.spd / 150 * 100) + '%'"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Bento Grid Profile Details -->
                        <div class="grid grid-cols-3 gap-4">
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5 hover:bg-white/10 transition">
                                <p class="text-[9px] text-slate-500 font-bold mb-1 uppercase tracking-widest">소속 세가</p>
                                <p class="text-base font-black text-amber-500 serif" x-text="selectedChar.family || '무소속'"></p>
                            </div>
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5 hover:bg-white/10 transition">
                                <p class="text-[9px] text-slate-500 font-bold mb-1 uppercase tracking-widest">나이 / 성별</p>
                                <p class="text-base font-black text-white" x-text="(selectedChar.age || '??') + ' / ' + (selectedChar.gender || '?')"></p>
                            </div>
                            <div class="bg-white/5 p-4 rounded-2xl border border-white/5 hover:bg-white/10 transition">
                                <p class="text-[9px] text-slate-500 font-bold mb-1 uppercase tracking-widest">성격</p>
                                <p class="text-base font-black text-emerald-400" x-text="selectedChar.personality || '불명'"></p>
                            </div>
                            <div class="col-span-3 bg-white/5 p-5 rounded-2xl border border-white/5 relative overflow-hidden group">
                                <div class="absolute top-4 right-6 opacity-5 group-hover:opacity-10 transition-opacity"><i data-lucide="network" class="w-12 h-12"></i></div>
                                <p class="text-[9px] text-slate-500 font-bold mb-2 uppercase tracking-widest">강호 관계도</p>
                                <p class="text-sm text-slate-300 leading-relaxed italic" x-text="selectedChar.relationships || '강호에 아는 이가 없습니다.'"></p>
                            </div>
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button @click="setLobbyCharacter(selectedChar.id)" class="flex-1 py-4 bg-gradient-to-r from-amber-600 to-amber-500 text-white font-black rounded-2xl transition hover:scale-[1.02] active:scale-95 shadow-xl shadow-amber-900/40 text-sm tracking-widest">
                                SET LOBBY MAIN
                            </button>
                            <button @click="showAlert('무공 수련관은 준비 중입니다.')" class="flex-1 py-4 bg-slate-800 text-slate-400 font-black rounded-2xl transition hover:bg-slate-700 text-sm text-center border border-white/5">
                                무공 수련 (TRAIN)
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [TOWER] 무한의 탑 -->
            <template x-if="currentModal==='TOWER'">
                <div class="glass-panel w-full max-w-2xl mx-auto p-10 shadow-2xl relative overflow-hidden border-sky-500/30">
                    <div class="absolute inset-0 bg-gradient-to-b from-sky-500/10 to-transparent pointer-events-none"></div>
                    <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/5 relative z-10">
                        <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase flex items-center gap-3">
                            <i data-lucide="tower-control" class="text-sky-400"></i> Tower of Infinity
                        </h2>
                        <button @click="closeModal()" class="glass-button w-10 h-10 rounded-full flex items-center justify-center"><i data-lucide="x"></i></button>
                    </div>

                    <div class="text-center py-10 relative z-10">
                        <div class="inline-block p-6 rounded-full bg-sky-500/10 border-2 border-sky-500/30 mb-8 shadow-[0_0_40px_rgba(56,189,248,0.2)]">
                            <span class="text-6xl font-black text-white italic" x-text="towerFloor || 1">1</span>
                            <span class="text-2xl font-bold text-sky-400 ml-2">FLOOR</span>
                        </div>
                        <p class="text-slate-400 text-sm mb-12">끝없이 이어지는 시련의 탑입니다. 층을 오를수록 더욱 강력한 적과 마주하게 됩니다.</p>
                        
                        <div class="grid grid-cols-3 gap-4 mb-12">
                            <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                                <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Clear Reward</p>
                                <span class="text-white font-bold flex items-center justify-center gap-1"><i data-lucide="gem" class="w-3 h-3 text-cyan-400"></i> 100</span>
                            </div>
                            <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                                <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Diff Rank</p>
                                <span class="text-white font-bold" x-text="towerFloor > 10 ? 'HARD' : 'EASY'">EASY</span>
                            </div>
                            <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                                <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Required CP</p>
                                <span class="text-white font-bold" x-text="(towerFloor * 500) + 1000">1500</span>
                            </div>
                        </div>

                        <button @click="showAlert('무한의 탑 전장에 입장합니다.'); window.location.href='/battle-tower?floor=' + towerFloor;" 
                                class="w-full py-5 bg-gradient-to-r from-sky-600 to-sky-500 text-white font-black rounded-2xl transition hover:scale-[1.02] active:scale-95 shadow-xl shadow-sky-900/40 uppercase tracking-widest">
                            Challenge Next Floor
                        </button>
                    </div>
                </div>
            </template>

            <!-- [RAID] 주간 레이드 -->
            <template x-if="currentModal==='RAID'">
                <div class="glass-panel w-full max-w-2xl mx-auto p-10 shadow-2xl relative overflow-hidden border-orange-500/30">
                    <div class="absolute inset-0 bg-gradient-to-b from-orange-500/10 to-transparent pointer-events-none"></div>
                    <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/5 relative z-10">
                        <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase flex items-center gap-3">
                            <i data-lucide="flame" class="text-orange-500"></i> Weekly Raid
                        </h2>
                        <button @click="closeModal()" class="glass-button w-10 h-10 rounded-full flex items-center justify-center"><i data-lucide="x"></i></button>
                    </div>

                    <div class="flex flex-col md:flex-row gap-8 relative z-10">
                        <div class="flex-shrink-0 w-full md:w-56 h-72 bg-slate-900 rounded-3xl overflow-hidden border border-white/10 shadow-inner">
                            <img src="/images/boss_raid_01.png" class="w-full h-full object-cover" onerror="this.src='https://generated-image.com/boss_placeholder'">
                        </div>
                        <div class="flex-grow">
                            <span class="px-2 py-1 bg-red-600 text-white text-[9px] font-bold rounded uppercase tracking-widest mb-3 inline-block">Active Now</span>
                            <h3 class="text-2xl font-bold text-white serif mb-2">용염각수 (LV. 80)</h3>
                            <p class="text-slate-500 text-xs leading-relaxed mb-8">화염의 정수를 집어삼킨 전설의 마수입니다. 수중에 있는 모든 동료들과 힘을 합치십시오.</p>
                            
                            <div class="space-y-4 mb-10">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-slate-400">내 최고 점수</span>
                                    <span class="text-white font-bold" x-text="(raidStage * 5000).toLocaleString() + ' PTS'">0 PTS</span>
                                </div>
                                <div class="flex justify-between items-center text-xs">
                                    <span class="text-slate-400">잔여 도전 횟수</span>
                                    <span class="text-orange-400 font-bold">1/3</span>
                                </div>
                                <div class="w-full h-1 bg-slate-800 rounded-full overflow-hidden">
                                    <div class="h-full bg-orange-500 w-[75%]"></div>
                                </div>
                            </div>

                            <button @click="showAlert('레이드 결사대에 합류합니다.'); window.location.href='/battle-raid';" 
                                    class="w-full py-4 bg-gradient-to-r from-orange-600 to-red-600 text-white font-black rounded-2xl transition hover:scale-[1.02] active:scale-95 shadow-xl shadow-orange-900/40 uppercase tracking-widest">
                                Battle Start
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [DAILY_HALL] 기억의 전당 -->
            <template x-if="currentModal==='DAILY_HALL'">
                <div class="glass-panel w-full max-w-4xl mx-auto p-10 shadow-2xl relative overflow-hidden border-indigo-500/30">
                    <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/10 to-transparent pointer-events-none"></div>
                    <div class="flex justify-between items-center mb-10 relative z-10">
                        <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase flex items-center gap-3">
                            <i data-lucide="sparkles" class="text-indigo-400"></i> Hall of Memories
                        </h2>
                        <button @click="closeModal()" class="glass-button w-10 h-10 rounded-full flex items-center justify-center"><i data-lucide="x"></i></button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 relative z-10">
                        <template x-for="(hall, idx) in [
                            {name: '금화의 기억', desc: '강호의 재물들이 모인 환영', color: 'text-yellow-500', icon: 'coins'},
                            {name: '연련의 기억', desc: '무공 경험치가 응축된 환영', color: 'text-sky-500', icon: 'sparkles'},
                            {name: '성장의 기억', desc: '진화의 재료들이 잠든 환영', color: 'text-emerald-500', icon: 'zap'}
                        ]" :key="idx">
                            <div class="bg-black/40 border border-white/5 rounded-3xl p-8 hover:bg-black/60 transition group cursor-pointer" @click="showAlert(hall.name + ' 전장에 입장합니다.');">
                                <div class="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-white/10 transition" :class="hall.color">
                                    <i :data-lucide="hall.icon" class="w-8 h-8"></i>
                                </div>
                                <h4 class="text-xl font-bold text-white mb-2 serif" x-text="hall.name"></h4>
                                <p class="text-slate-500 text-xs mb-8 leading-relaxed" x-text="hall.desc"></p>
                                <span class="text-[10px] font-black uppercase tracking-widest text-indigo-400 group-hover:translate-x-2 transition inline-block">Enter Realm &rarr;</span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- [CONSTRUCTION] 준비 중 -->
            <template x-if="['QUEST_REWARD'].includes(currentModal)">
                <div class="glass-panel w-full max-w-md mx-auto p-12 text-center shadow-2xl">
                    <i data-lucide="construction" class="w-16 h-16 text-slate-600 mx-auto mb-6"></i>
                    <h3 class="text-xl font-bold text-white mb-2 serif">수련 환경 정비 중</h3>
                    <p class="text-slate-500 text-sm leading-relaxed">대협, 이곳은 현재 수련 환경 개선 중입니다. 곧 새로운 모습으로 찾아뵙겠습니다.</p>
                    <button @click="closeModal()" class="mt-8 glass-button px-10 py-2 rounded-full text-xs">로비로 원복</button>
                </div>
            </template>

            <!-- [PORTRAIT_SELECT] 프로필 초상화 선택 -->
            <template x-if="currentModal==='PORTRAIT_SELECT'">
                <div class="glass-panel w-full max-w-xl mx-auto p-10 shadow-2xl relative border-amber-500/30">
                    <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                        <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase italic">Select Portrait</h2>
                        <button @click="openModal('MY_PROFILE')" class="glass-button w-8 h-8 rounded-full flex items-center justify-center"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-4 max-h-[50vh] overflow-y-auto custom-scrollbar pr-2">
                        <!-- Default Portraits -->
                        <div @click="selectPortrait('/images/portrait_male.png')" class="relative cursor-pointer group">
                            <img src="/images/portrait_male.png" class="w-full aspect-square object-cover rounded-xl border-2 border-white/5 group-hover:border-amber-500/50 transition">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] font-bold text-white uppercase">Male</div>
                        </div>
                        <div @click="selectPortrait('/images/portrait_female.png')" class="relative cursor-pointer group">
                            <img src="/images/portrait_female.png" class="w-full aspect-square object-cover rounded-xl border-2 border-white/5 group-hover:border-amber-500/50 transition">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] font-bold text-white uppercase">Female</div>
                        </div>
                        <!-- My Characters as Portraits -->
                        <template x-for="char in myCharacters" :key="char.id">
                            <div @click="selectPortrait(char.src)" class="relative cursor-pointer group">
                                <img :src="char.src" class="w-full aspect-square object-cover rounded-xl border-2 border-white/5 group-hover:border-amber-500/50 transition">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] font-bold text-white uppercase" x-text="char.name"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- [SYSTEM_ALERT] 시스템 알림 모달 -->
            <template x-if="currentModal==='SYSTEM_ALERT'">
                <div class="glass-panel w-full max-w-sm mx-auto p-8 text-center shadow-2xl border-amber-500/30">
                    <div class="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i data-lucide="bell" class="w-8 h-8 text-amber-500"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-4 serif">알림</h3>
                    <p class="text-slate-300 text-sm leading-relaxed mb-8" x-text="alertMessage"></p>
                    <button @click="closeModal()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition shadow-lg shadow-amber-900/40">확인</button>
                </div>
            </template>

            <!-- [QUEST_REWARD] 퀘스트 완료 보상 모달 -->
            <template x-if="currentModal==='QUEST_REWARD_CLAIM'">
                <div class="glass-panel w-full max-w-md mx-auto p-10 text-center shadow-2xl border-amber-500 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-b from-amber-500/20 to-transparent pointer-events-none"></div>
                    <div class="relative z-10">
                        <div class="w-24 h-24 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-8 animate-bounce shadow-[0_0_50px_rgba(245,158,11,0.4)]">
                            <i data-lucide="gift" class="w-12 h-12 text-amber-500"></i>
                        </div>
                        <h2 class="text-4xl font-black text-white italic tracking-tighter mb-2 italic">QUEST CLEARED!</h2>
                        <p class="text-amber-500 font-bold text-sm uppercase tracking-widest mb-10">퀘스트 달성 보상이 도착했습니다.</p>
                        
                        <div class="bg-black/40 rounded-2xl p-6 mb-10 border border-white/5 flex items-center justify-center gap-6">
                            <div class="flex flex-col items-center">
                                <i data-lucide="gem" class="w-8 h-8 text-cyan-400 mb-2"></i>
                                <span class="text-2xl font-black text-white">1,500</span>
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Gems</span>
                            </div>
                            <div class="w-px h-12 bg-white/10"></div>
                            <div class="flex flex-col items-center">
                                <i data-lucide="coins" class="text-yellow-500 w-8 h-8 mb-2"></i>
                                <span class="text-2xl font-black text-white">5,000</span>
                                <span class="text-[10px] text-slate-500 font-bold uppercase">Gold</span>
                            </div>
                        </div>
                        
                        <button @click="claimQuestReward()" class="w-full py-4 bg-gradient-to-r from-amber-600 to-amber-500 text-white font-black rounded-2xl transition hover:scale-[1.02] active:scale-95 shadow-xl shadow-amber-900/40 uppercase tracking-widest">
                            Claim Rewards
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
        </div>
    </div>
</body>
</html>
